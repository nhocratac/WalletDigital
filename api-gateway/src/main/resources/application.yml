server:
  port: 8081
spring:
  application:
    name: api-gateway

# Observability Nac 1 (OB2) — traceId trong moi dong log.
# TraceIdFilter dat traceId vao MDC; pattern dinh [%X{traceId}] -> moi log tu mang correlation ID.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

gateway:
  service-id: api-gateway
  hmac-secret: ${GATEWAY_HMAC_SECRET:local-dev-secret}
  routes:
    "[/api/wallets]": http://localhost:8080
  # PEM Base64 (chỉ phần DER, bỏ dòng BEGIN/END). Nạp từ env ở production.
  jwt-public-key: ${GATEWAY_JWT_PUBLIC_KEY:}
