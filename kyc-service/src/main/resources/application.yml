server:
  port: 8082
spring:
  application:
    name: kyc-service
  datasource:
    url: jdbc:h2:mem:kycdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update   # nợ kỹ thuật đã ghi nhận — production dùng Flyway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

# Observability Nac 1 (OB2) — traceId trong moi dong log.
# TraceIdFilter dat traceId vao MDC; pattern dinh [%X{traceId}] -> moi log tu mang correlation ID.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

kyc:
  events:
    kafka-enabled: ${KYC_KAFKA_ENABLED:false}    # mặc định TẮT -> test cũ không cần Kafka
  outbox:
    relay-interval-ms: ${KYC_OUTBOX_RELAY_INTERVAL_MS:2000}   # OutboxRelay @Scheduled cadence (O2)
    relay-batch-size: ${KYC_OUTBOX_RELAY_BATCH_SIZE:100}      # số row PENDING xử lý mỗi lượt relay
    # Cờ RIÊNG (không dùng chung kafka-enabled) bật thật sự chạy @Scheduled nền — mặc định TẮT để
    # test set kyc.events.kafka-enabled=true (vd test đường ghi outbox) không vô tình có relay chạy
    # nền. Production bật CẢ 2 cờ (kafka-enabled + relay-scheduling-enabled).
    relay-scheduling-enabled: ${KYC_OUTBOX_RELAY_SCHEDULING_ENABLED:false}
  internal-hmac-secret: ${KYC_INTERNAL_HMAC_SECRET:local-dev-secret}
  verifier-hmac-secret: ${KYC_VERIFIER_HMAC_SECRET:verifier-dev-secret}
  allowed-services: api-gateway,wallet-service
  revoke-role: compliance
