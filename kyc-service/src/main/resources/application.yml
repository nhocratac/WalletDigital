server:
  port: 8082
spring:
  application:
    name: kyc-service
  datasource:
    url: jdbc:h2:mem:kycdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update   # nợ kỹ thuật đã ghi nhận — production dùng Flyway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

# Observability Nac 1 (OB2) — traceId trong moi dong log.
# TraceIdFilter dat traceId vao MDC; pattern dinh [%X{traceId}] -> moi log tu mang correlation ID.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

kyc:
  events:
    kafka-enabled: ${KYC_KAFKA_ENABLED:false}    # mặc định TẮT -> test cũ không cần Kafka
  outbox:
    relay-interval-ms: ${KYC_OUTBOX_RELAY_INTERVAL_MS:2000}   # OutboxRelay @Scheduled cadence (O2)
    relay-batch-size: ${KYC_OUTBOX_RELAY_BATCH_SIZE:100}      # số row PENDING xử lý mỗi lượt relay
    # KHÔNG có cờ relay-scheduling-enabled riêng: OutboxSchedulingConfig bật @EnableScheduling ngay
    # khi kyc.events.kafka-enabled=true (đúng hợp đồng activation của outbox pattern — production chỉ
    # set KYC_KAFKA_ENABLED=true, không cần biến môi trường thứ hai).
    # relay-initial-delay-ms mặc định 0 (prod chạy ngay) — TEST HOOK: fixedDelay không có initial
    # delay sẽ fire lượt ĐẦU ngay khi context start bất kể interval, nên test nào bật kafka-enabled
    # nhưng cần relay nền im lặng (vd KycServiceOutboxIntegrationTest mock KafkaTemplate, hoặc
    # OutboxRelayTest gọi thẳng relayPass()) phải override CẢ relay-initial-delay-ms LẪN
    # relay-interval-ms = 2147483647 trong @SpringBootTest properties của chính nó.
    relay-initial-delay-ms: ${KYC_OUTBOX_RELAY_INITIAL_DELAY_MS:0}
    # OutboxPurge (O5) — dọn row SENT cũ hơn TTL để bảng outbox không phình vô hạn. Cùng cờ activation
    # với relay (kyc.events.kafka-enabled=true), không có cờ riêng. Mặc định 1 giờ/lượt là đủ thưa vì
    # đây chỉ là dọn dẹp định kỳ, không nằm trên đường ghi/relay nóng.
    ttl-days: ${KYC_OUTBOX_TTL_DAYS:7}
    purge-interval-ms: ${KYC_OUTBOX_PURGE_INTERVAL_MS:3600000}
    # purge-initial-delay-ms mặc định 0 (prod chạy ngay) — TEST HOOK giống relay-initial-delay-ms: test
    # nào bật kafka-enabled nhưng cần purge nền im lặng phải override CẢ purge-initial-delay-ms LẪN
    # purge-interval-ms = 2147483647 trong @SpringBootTest properties của chính nó.
    purge-initial-delay-ms: ${KYC_OUTBOX_PURGE_INITIAL_DELAY_MS:0}
  internal-hmac-secret: ${KYC_INTERNAL_HMAC_SECRET:local-dev-secret}
  verifier-hmac-secret: ${KYC_VERIFIER_HMAC_SECRET:verifier-dev-secret}
  allowed-services: api-gateway,wallet-service
  revoke-role: compliance
