# ===== Application config =====
# Spring reads this file automatically at startup.

# The name of our service (shows up in logs).
spring.application.name=wallet-service

# The port the web server listens on. Visit http://localhost:8080
server.port=8080

# ===== Database (H2 in-memory by default; MySQL in prod via env) =====
# "mem" = lives in memory only; data is wiped when the app stops.
# SP5: prod target is MySQL; override datasource via env. H2 default keeps dev/test fast.
spring.datasource.url=${WALLET_DB_URL:jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${WALLET_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${WALLET_DB_USERNAME:sa}
spring.datasource.password=${WALLET_DB_PASSWORD:}

# ===== Flyway (SP5, T7) — migrations REPLACE hibernate auto-DDL =====
# ddl-auto=none: Hibernate NO LONGER creates/updates tables; Flyway migrations are
# the single source of truth. Task 1 baseline: single-schema (tenant location only).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tenant

# ===== Open-Session-In-View OFF (SP5 T9) — REQUIRED for schema-per-tenant correctness =====
# With OSIV on, the EntityManager (and its tenant-resolved connection) is opened at the START of the
# request — BEFORE the controller can set TenantContext. For the bank settlement webhook (which carries
# no X-Tenant-Id and recovers the tenant from the bankRef inside the controller) the session would bind
# to the empty/fail-closed schema and every routed query would fail. Disabling OSIV defers the session
# (and its SET SCHEMA) to the @Transactional boundary, AFTER the tenant context is set. Entities are flat
# (no lazy associations rendered post-tx), so this is safe.
spring.jpa.open-in-view=false

# Print the SQL that JPA generates — great for LEARNING what's happening underneath.
spring.jpa.show-sql=true

# Enable the H2 web console at http://localhost:8080/h2-console
# (handy to SEE your data in a browser). Use JDBC URL: jdbc:h2:mem:walletdb
spring.h2.console.enabled=true

# ===== Internal inbound HMAC auth (Stage4 S1/S2/S3) =====
# Wallet VERIFY HMAC inbound thay vi tin X-User-Id/X-Tenant-Id tran (bit lo hong zero-trust).
# hmac-secret PHAI khop GATEWAY_HMAC_SECRET (gateway ky canonical gom identity).
# allowed-services: chi caller trong allowlist moi qua (X-Service-Id) -> secret theo caller.
# auth-enabled=true mac dinh BAT o production; bo test chuc nang cu tat (surefire) de giu hanh vi.
wallet.internal.auth-enabled=${WALLET_INTERNAL_AUTH_ENABLED:true}
wallet.internal.hmac-secret=${WALLET_INTERNAL_HMAC_SECRET:it-secret}
wallet.internal.allowed-services=${WALLET_INTERNAL_ALLOWED_SERVICES:api-gateway}

# ===== KYC gate (SP3) =====
# base-url tro kyc-service; hmac-secret phai khop kyc.internal-hmac-secret cua kyc-service.
# service-id da nam trong allowlist cua kyc (SP2).
wallet.kyc.base-url=${WALLET_KYC_BASE_URL:http://localhost:8082}
wallet.kyc.hmac-secret=${WALLET_KYC_HMAC_SECRET:local-dev-secret}
wallet.kyc.service-id=wallet-service
wallet.kyc.cache-ttl-seconds=60
wallet.kyc.timeout-millis=2000

# ===== Bank (SP4) =====
# Cu goi NGOAI transaction; timeout/5xx/breaker -> UNKNOWN (khong tu refund).
# wallet.bank.mock=true -> dung MockBankClient (dev/test/e2e), khong goi mang.
wallet.bank.mock=${WALLET_BANK_MOCK:false}
wallet.bank.base-url=${WALLET_BANK_BASE_URL:http://localhost:8083}
wallet.bank.hmac-secret=${WALLET_BANK_HMAC_SECRET:local-dev-bank-secret}
wallet.bank.service-id=wallet-service
wallet.bank.timeout-millis=2000
# Webhook fast path: secret RIENG cho bank -> wallet (segmentation, khac hmac-secret goi di).
wallet.bank.webhook-secret=${WALLET_BANK_WEBHOOK_SECRET:local-dev-bank-webhook-secret}

# ===== Reconciliation worker (SP4, E6) =====
# Slow path: quet order chua-terminal (PENDING/SENT) dinh ky, hoi bank, lai toi terminal.
# wallet.reconcile.enabled=true -> bat scheduler (@Scheduled). Mac dinh TAT (test/dev cu khong chay nen).
wallet.reconcile.enabled=${WALLET_RECONCILE_ENABLED:false}
wallet.reconcile.interval-ms=${WALLET_RECONCILE_INTERVAL_MS:30000}
wallet.reconcile.batch-limit=${WALLET_RECONCILE_BATCH_LIMIT:100}

# ===== Idempotency record TTL purge (SP7 Buoc 1, Task 6) =====
# Bang idempotency_record la nguon enforce dedup; purge record qua han TTL de bang khong phinh.
# purge.enabled=true -> bat scheduler (@Scheduled), lap tenant registry per-schema. Mac dinh TAT.
# ttl-days: record cu hon nay bi xoa (client thuc te khong con retry sau cua so nay).
wallet.idempotency.purge.enabled=${WALLET_IDEMPOTENCY_PURGE_ENABLED:false}
wallet.idempotency.purge.interval-ms=${WALLET_IDEMPOTENCY_PURGE_INTERVAL_MS:3600000}
wallet.idempotency.ttl-days=${WALLET_IDEMPOTENCY_TTL_DAYS:7}

# ===== Kafka consumer kyc.revoked (SP3) =====
# mặc định TẮT -> test/dev cũ không cần Kafka; bật bằng WALLET_KAFKA_ENABLED=true.
wallet.events.kafka-enabled=${WALLET_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
