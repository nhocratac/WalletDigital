<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang tải tài liệu… · WalletDigital</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<style>
  :root{--bg:#0f1117;--card:#171a21;--ink:#e6e6e6;--muted:#9aa4b2;--accent:#7c9cff;--accent2:#5be7c4;--line:#2a2f3a;--yellow:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65;font-size:16px;}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 24px 96px}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  a.back{color:var(--accent);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--card)}
  a.back:hover{border-color:var(--accent)}
  .src{color:var(--muted);font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace}
  #doc h1{font-size:28px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-top:8px}
  #doc h2{font-size:21px;margin-top:36px;border-bottom:1px solid var(--line);padding-bottom:7px;color:#fff}
  #doc h3{font-size:17px;margin-top:24px;color:#dbe2f0}
  #doc a{color:var(--accent)}
  #doc code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:5px;font-size:13.5px;font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--accent2)}
  #doc pre{background:#11141c;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
  #doc pre code{background:none;padding:0;color:#e6e6e6;font-size:13px;line-height:1.5}
  #doc blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--yellow);background:rgba(255,209,102,.08);border-radius:0 10px 10px 0;color:#cfd6e4}
  #doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;display:block;overflow-x:auto}
  #doc th,#doc td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  #doc th{background:rgba(124,156,255,.12);color:#fff}
  #doc li{margin:3px 0}
  #doc input[type=checkbox]{margin-right:8px;transform:scale(1.15)}
  #doc .mermaid{display:flex;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  #status{color:var(--muted);padding:40px 0;font-size:15px}
  #status.err{color:#ff8a8a}
  footer{margin-top:48px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Trang chủ tài liệu</a>
    <span class="src" id="srcpath"></span>
  </div>
  <div id="status">Đang tải tài liệu…</div>
  <article id="doc"></article>
  <footer>WalletDigital · markdown viewer (marked + highlight.js + mermaid) · render client-side</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
<script type="module">
  import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js';
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const params = new URLSearchParams(location.search);
  const doc = params.get('doc') || '';
  const status = document.getElementById('status');
  const article = document.getElementById('doc');
  document.getElementById('srcpath').textContent = doc;

  // chỉ cho phép xem file .md trong docs/ (an toàn, tránh trỏ lung tung)
  const safe = /^docs\/[A-Za-z0-9._\/-]+\.md$/.test(doc) && !doc.includes('..');
  if (!safe) {
    status.className = 'err';
    status.textContent = 'Đường dẫn không hợp lệ. Dùng: view.html?doc=docs/superpowers/plans/<file>.md';
  } else {
    marked.setOptions({ gfm: true, breaks: false });
    fetch(doc)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(md => {
        article.innerHTML = marked.parse(md);

        // tiêu đề trang theo H1 đầu tiên
        const h1 = article.querySelector('h1');
        if (h1) document.title = h1.textContent + ' · WalletDigital';

        // chuyển code block ```mermaid thành sơ đồ
        article.querySelectorAll('code.language-mermaid').forEach(c => {
          const pre = c.closest('pre');
          const box = document.createElement('pre');
          box.className = 'mermaid';
          box.textContent = c.textContent;
          pre.replaceWith(box);
        });

        // highlight các code block còn lại
        article.querySelectorAll('pre code:not(.language-mermaid)').forEach(el => {
          try { window.hljs.highlightElement(el); } catch (e) {}
        });

        // render mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
        mermaid.run({ querySelector: '.mermaid' }).catch(() => {});

        status.style.display = 'none';
      })
      .catch(err => {
        status.className = 'err';
        status.textContent = 'Không tải được tài liệu: ' + err.message + ' — (mở qua http/GitHub Pages, không phải file://)';
      });
  }
</script>
</body>
</html>
